name: Release

# Publishes the tagged version to npm with trusted publishing (OIDC): no token, no interactive 2FA, provenance attached.
# npmjs.com must list this repository and this file name (release.yml) as the package's trusted publisher.
# After a successful publish it creates the tag's GitHub Release, with that version's CHANGELOG section word for word, marked Latest.
# Run it by hand (workflow_dispatch):
# - with release_tag set, it does only the GitHub Release step for that tag (creates or updates it); it never publishes to npm;
# - with release_tag empty, it checks the trusted-publisher exchange alone: it requests the OIDC token, shows the claims npm matches, and
#   asks npm for a publish token, which it never prints or uses. Nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create or update the GitHub Release for (e.g. v1.3.3). Empty: run the npm exchange check instead. Never publishes to npm.'
        required: false
        default: ''
      append_note:
        description: 'Optional line appended to the release notes.'
        required: false
        default: ''
      latest:
        description: 'Mark this release Latest (false for backfilling older tags).'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Verbose logging shows the trusted-publisher exchange's outcome (npm logs it only at verbose).
      - run: npm --version && npm publish --loglevel verbose

  github-release:
    needs: publish
    # On a tag push, only after npm publish succeeded; by hand, only when a tag is given (the publish job never runs by hand).
    if: always() && ((github.event_name == 'push' && needs.publish.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      APPEND_NOTE: ${{ inputs.append_note }}
      LATEST: ${{ github.event_name == 'push' && 'true' || inputs.latest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      - name: Release notes from the tag's CHANGELOG section, word for word
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          if [ -n "$APPEND_NOTE" ]; then printf '\n%s\n' "$APPEND_NOTE" >> notes.md; fi
          cat notes.md
      - name: Create or update the GitHub Release (Latest unless backfilling)
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --latest="$LATEST"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest="$LATEST" --verify-tag
          fi
      # Last and non-blocking: asks Cloudflare Pages to rebuild galyavin.com, whose build step writes this
      # release's npm version and date into the pi-tuck row. A failure here never marks the release red.
      - name: Refresh the pi-tuck row on galyavin.com
        if: github.event_name == 'push' && env.LATEST == 'true'
        continue-on-error: true
        env:
          HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "PAGES_DEPLOY_HOOK not set; skipped"; exit 0; }
          curl -fsS --max-time 20 -X POST "$HOOK" >/dev/null || echo "::warning::galyavin.com deploy hook failed; the row updates at the next site deploy"

  exchange-check:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Trusted-publisher exchange (nothing is published)
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          echo "package: $name; repository.url: $(node -p "require('./package.json').repository.url")"
          id=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "OIDC claims npm matches:"
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url"));for(const k of ["iss","aud","repository","repository_owner","repository_visibility","workflow_ref","job_workflow_ref","ref","event_name","environment"])console.log(`  ${k}: ${p[k]??"(none)"}`)' "$id"
          status=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id" -H 'Content-Type: application/json' "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          echo "exchange HTTP status: $status"
          node -e 'const b=require("./body.json");if(b.token)b.token="(redacted: a token was issued)";console.log("exchange response:",JSON.stringify(b))' || cat body.json
          rm -f body.json
          case "$status" in 2??) echo "the trusted-publisher exchange works";; *) echo "the trusted-publisher exchange failed"; exit 1;; esac
