name: Release

# Publishes the tagged version to npm with trusted publishing (OIDC): no token, no interactive 2FA, provenance attached.
# npmjs.com must list this repository and this file name (release.yml) as the package's trusted publisher.
# Run it by hand (workflow_dispatch) to check the trusted-publisher exchange alone: it requests the OIDC token, shows the claims npm
# matches, and asks npm for a publish token, which it never prints or uses. Nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Verbose logging shows the trusted-publisher exchange's outcome (npm logs it only at verbose).
      - run: npm --version && npm publish --loglevel verbose

  exchange-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Trusted-publisher exchange (nothing is published)
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          echo "package: $name; repository.url: $(node -p "require('./package.json').repository.url")"
          id=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "OIDC claims npm matches:"
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url"));for(const k of ["iss","aud","repository","repository_owner","repository_visibility","workflow_ref","job_workflow_ref","ref","event_name","environment"])console.log(`  ${k}: ${p[k]??"(none)"}`)' "$id"
          status=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id" -H 'Content-Type: application/json' "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          echo "exchange HTTP status: $status"
          node -e 'const b=require("./body.json");if(b.token)b.token="(redacted: a token was issued)";console.log("exchange response:",JSON.stringify(b))' || cat body.json
          rm -f body.json
          [ "$status" = 200 ] || { echo "the trusted-publisher exchange failed"; exit 1; }
