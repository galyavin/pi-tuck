name: Bug report
description: Something in pi-tuck does not work as expected.
labels: [bug]
body:
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Output of `pi --version`.
    validations:
      required: true
  - type: input
    id: pi-tuck-version
    attributes:
      label: pi-tuck version
      description: Shown by `/tuck` in Pi, or the version in your Pi settings.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example macOS 15.2, Ubuntu 24.04, Windows 11.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. Include the model and context window if they matter.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error or unexpected result
      description: The exact error text or notice, and what you expected instead.
      render: text
    validations:
      required: true
